<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Deposit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  
  body {
    min-height: 100vh;
    background: #080a12;
    color: #e8eaf0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* --- Dashboard / Index 2 Styles --- */
  .dashboard-card {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(160deg, #141824 0%, #0d1017 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    text-align: center;
  }

  .balance-label {
    font-size: 13px;
    color: #8b93a7;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .balance-amount {
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 20px;
  }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .action-btn {
    flex: 1;
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-deposit {
    background: linear-gradient(135deg, #f7931a, #e2761b);
    color: #fff;
    box-shadow: 0 4px 12px rgba(247, 147, 26, 0.25);
  }

  .btn-deposit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(247, 147, 26, 0.4);
  }

  .btn-withdraw {
    background: rgba(255, 255, 255, 0.06);
    color: #cfd6e4;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .btn-withdraw:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  /* --- Deposit Modal Overlay --- */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(8, 10, 18, 0.75);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }

  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  /* --- Original Popup Styles --- */
  .popup {
    width: 100%; max-width: 380px;
    background: linear-gradient(160deg, #141824 0%, #0d1017 100%);
    border: 1px solid rgba(247, 147, 26, 0.25);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
    color: #e8eaf0;
    text-align: center;
    position: relative;
    transform: scale(0.92) translateY(12px);
    transition: transform 0.3s cubic-bezier(.2,.9,.3,1.2);
  }

  .modal-overlay.active .popup {
    transform: scale(1) translateY(0);
  }

  .close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; color: #6b7280;
    font-size: 20px; cursor: pointer; line-height: 1;
    transition: color .2s;
  }
  .close:hover { color: #fff; }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: #f7931a; margin-bottom: 6px;
  }
  .badge::before, .badge::after { content: ''; width: 24px; height: 1px; background: rgba(247,147,26,.4); }

  h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #8b93a7; margin-bottom: 20px; }

  .qr-wrap {
    background: #fff; border-radius: 16px; padding: 12px;
    display: inline-block; margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(247,147,26,.15);
  }
  .qr-wrap img { display: block; border-radius: 8px; width: 240px; height: 240px; object-fit: cover; }

  .addr-box {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 10px 10px 10px 14px;
    margin-bottom: 16px; text-align: left;
  }
  .addr {
    flex: 1; font-family: 'Courier New', monospace;
    font-size: 12.5px; word-break: break-all; color: #cfd6e4; line-height: 1.5;
  }
  .copy-btn {
    flex-shrink: 0; border: none; cursor: pointer;
    background: linear-gradient(135deg, #f7931a, #e2761b);
    color: #fff; font-size: 12px; font-weight: 600;
    padding: 9px 14px; border-radius: 9px;
    transition: transform .15s, box-shadow .15s;
  }
  .copy-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(247,147,26,.4); }
  .copy-btn:active { transform: scale(.96); }
  .copy-btn.copied { background: linear-gradient(135deg, #22c55e, #16a34a); }

  .warn {
    font-size: 11.5px; color: #fbbf24;
    background: rgba(251,191,36,.08);
    border: 1px solid rgba(251,191,36,.2);
    border-radius: 10px; padding: 9px 12px;
  }
  .warn b { color: #fde68a; }

  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #22c55e; color: #fff;
    padding: 10px 20px; border-radius: 99px;
    font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: all .3s ease;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
