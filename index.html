<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Expense Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #ec4899;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --input-bg: #0f172a;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-color);
      min-height: 100vh;
    }

    /* Screen Transitions */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 24px;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Onboarding Screen */
    .onboard-content {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .onboard-title {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }

    .onboard-subtitle {
      color: var(--text-sub);
      text-align: center;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 14px;
      color: var(--text-sub);
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text-main);
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 16px;
      border-radius: 12px;
      border: none;
      background-color: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Home & App Elements */
    .header {
      padding: 24px 0 12px 0;
    }

    .greeting {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }

    .balance-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0;
      border: 1px solid var(--border);
    }

    .balance-label {
      font-size: 13px;
      color: var(--text-sub);
    }

    .balance-amount {
      font-size: 32px;
      font-weight: 800;
      margin-top: 4px;
    }

    .add-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 80px;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .expense-info h4 {
      font-size: 15px;
      font-weight: 600;
    }

    .expense-info p {
      font-size: 12px;
      color: var(--text-sub);
    }

    .expense-amount {
      font-weight: 700;
      color: #f43f5e;
    }

    /* Bottom Navigation */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 64px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      color: var(--text-sub);
      font-size: 12px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Screen 1: Onboarding Setup (Only for first-time users) -->
    <div id="onboardScreen" class="screen">
      <div class="onboard-content">
        <h1 class="onboard-title">Welcome! ✨</h1>
        <p class="onboard-subtitle">Let's set up your profile to personalize your experience.</p>
        
        <div class="input-group">
          <label for="userName">Your Name</label>
          <input type="text" id="userName" placeholder="Enter your name..." />
        </div>

        <div class="input-group">
          <label for="userGender">Title Choice</label>
          <select id="userGender">
            <option value="female">Female (Queen)</option>
            <option value="male">Male (King)</option>
          </select>
        </div>

        <button class="btn" onclick="saveProfile()">Get Started</button>
      </div>
    </div>

    <!-- Screen 2: Main Home Screen -->
    <div id="homeScreen" class="screen">
      <div class="header">
        <h2 id="greetingText" class="greeting">Hello!</h2>
      </div>

      <div class="balance-card">
        <div class="balance-label">Total Spent</div>
        <div class="balance-amount" id="totalSpent">$0.00</div>
      </div>

      <form class="add-form" id="expenseForm" onsubmit="addExpense(event)">
        <input type="text" id="descInput" placeholder="Expense description..." required />
        <input type="number" id="amountInput" placeholder="Amount ($)" step="0.01" required />
        <button type="submit" class="btn">Add Expense</button>
      </form>

      <h3 style="margin-bottom: 12px; font-size: 16px;">Recent Expenses</h3>
      <div id="expenseList" class="expense-list"></div>

      <!-- Bottom Nav -->
      <nav class="nav-bar">
        <button class="nav-item active">Home</button>
        <button class="nav-item" onclick="resetProfile()" style="color: #ef4444;">Reset</button>
      </nav>
    </div>

  </div>

  <script>
    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

    // App Initialization
    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('user_name');
      const savedGender = localStorage.getItem('user_gender');

      if (!savedName || !savedGender) {
        showScreen('onboardScreen');
      } else {
        loadHomeScreen(savedName, savedGender);
      }
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function saveProfile() {
      const name = document.getElementById('userName').value.trim();
      const gender = document.getElementById('userGender').value;

      if (!name) {
        alert('Please enter your name.');
        return;
      }

      localStorage.setItem('user_name', name);
      localStorage.setItem('user_gender', gender);

      loadHomeScreen(name, gender);
    }

    function loadHomeScreen(name, gender) {
      const title = gender === 'male' ? 'my king' : 'my queen';
      document.getElementById('greetingText').innerText = `Hello ${name} ${title}, how are you doing?`;
      
      showScreen('homeScreen');
      renderExpenses();
    }

    function addExpense(e) {
      e.preventDefault();
      const desc = document.getElementById('descInput').value;
      const amount = parseFloat(document.getElementById('amountInput').value);

      if (desc && amount) {
        expenses.unshift({ id: Date.now(), desc, amount });
        localStorage.setItem('expenses', JSON.stringify(expenses));
        document.getElementById('descInput').value = '';
        document.getElementById('amountInput').value = '';
        renderExpenses();
      }
    }

    function renderExpenses() {
      const listEl = document.getElementById('expenseList');
      const totalEl = document.getElementById('totalSpent');
      
      listEl.innerHTML = '';
      let total = 0;

      expenses.forEach(item => {
        total += item.amount;
        const div = document.createElement('div');
        div.className = 'expense-item';
        div.innerHTML = `
          <div class="expense-info">
            <h4>${item.desc}</h4>
          </div>
          <div class="expense-amount">-$${item.amount.toFixed(2)}</div>
        `;
        listEl.appendChild(div);
      });

      totalEl.innerText = `$${total.toFixed(2)}`;
    }

    function resetProfile() {
      if (confirm('Are you sure you want to reset user info?')) {
        localStorage.removeItem('user_name');
        localStorage.removeItem('user_gender');
        location.reload();
      }
    }
  </script>
</body>
</html>
